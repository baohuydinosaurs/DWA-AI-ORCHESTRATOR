name: Run one real DWA AI worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Nhiệm vụ dành cho AI worker (tiếng Việt)"
        required: true
        type: string
      model:
        description: "Chỉ dùng model Gemini có hạn mức miễn phí; không nhập OpenAI model"
        required: false
        default: "gemini-3.8-flash"
        type: string

permissions:
  contents: read

concurrency:
  group: dwa-single-ai-worker
  cancel-in-progress: false

jobs:
  run-one-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Execute real Gemini free-tier model inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DWA_TASK: ${{ inputs.task }}
          DWA_MODEL: ${{ inputs.model }}
        run: node src/ai-worker.mjs

      - name: Upload AI worker result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dwa-ai-worker-result
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
