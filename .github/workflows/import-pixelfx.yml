name: Import PixelFX 244 source modules

on:
  push:
    branches:
      - integration/pixelfx-244-sketchup-assets
    paths:
      - .github/workflows/import-pixelfx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-pixelfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DWA
        uses: actions/checkout@v4
        with:
          ref: integration/pixelfx-244-sketchup-assets
          fetch-depth: 0
      - name: Checkout upstream PixelFX
        uses: actions/checkout@v4
        with:
          repository: patch-gg/pixelfx
          ref: main
          path: vendor-upstream
          persist-credentials: false
      - name: Vendor source and verify all effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pixelfx
          cp -R vendor-upstream/src vendor/pixelfx/
          cp vendor-upstream/LICENSE vendor-upstream/NOTICE.md vendor-upstream/README.md vendor/pixelfx/
          mkdir -p vendor/pixelfx/docs
          cp vendor-upstream/docs/CATALOG.md vendor/pixelfx/docs/
          EFFECT_COUNT=$(grep -F -c 'import * as' vendor/pixelfx/src/fx/index.js)
          test "$EFFECT_COUNT" -eq 244
          echo "Verified PixelFX effect imports: $EFFECT_COUNT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pixelfx
          if git diff --cached --quiet; then
            echo "PixelFX source already current"
            exit 0
          fi
          git commit -m "Vendor all 244 PixelFX effects with MIT notices"
          git push origin HEAD:integration/pixelfx-244-sketchup-assets
