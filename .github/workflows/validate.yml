name: Validate DWA Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/ai-worker.mjs
      - run: npm run master:plan
      - run: node -e "const p=require('./.runtime/master-plan.json'); if(p.workerCount!==100 || p.teamLeads.length!==10) process.exit(1); console.log('Master plan verified: 100 worker identities, 10 team leads.')"
