name: Validate DWA Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: node --check src/ai-worker.mjs
      - run: node --check src/task-runner.mjs
      - run: node --check src/gemini-adapter.mjs
      - run: npm run master:plan
      - run: npm run game:inspect
      - run: npm run game:preview
      - run: npm run policy:validate
      - name: Upload DWA AI integration previews
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dwa-ai-integration-preview
          path: artifacts/dwa-ai-preview/
          retention-days: 7
      - name: Verify generated Master AI plan
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const plan = JSON.parse(await readFile(".runtime/master-plan.json", "utf8"));
            if (plan.workerCount !== 100 || plan.teamLeads.length !== 10) process.exit(1);
            console.log("Master plan verified:", plan.workerCount, "worker identities and", plan.teamLeads.length, "team leads.");
          '
